name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Sync pinned AIDLC distribution
        run: bun run sync

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Projection drift
        run: bun scripts/build-projections.ts --check
